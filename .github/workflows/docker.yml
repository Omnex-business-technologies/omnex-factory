name: Docker

# The local-first stack's engine image, built the way `deploy/local/compose.yaml`
# documents building it, rather than assumed.
#
# **It has run, three times, and `C-014` is SUPPORTED (E-014).** The first
# dispatch (34275113635, from master) failed: the build context was `engine/`
# alone, so the ~90 tests that read `lib/`, `oss/`, `corpus/`, `state/`,
# `.github/workflows/`, `CLAUDE.md` and `execution_state.json` by design
# (CLAUDE.md's own `engine.yml` comment already says so) got a filesystem root
# instead of a repository root. Widening the build context to the repo root
# (D-012) fixed that but surfaced a second failure — `git` missing from the
# image and `.git/` excluded from the build context, so the four scripts that
# shell out to `git` for history-derived figures raised `FileNotFoundError`.
# The third dispatch (34277853648, run_number 3) is the one that went green:
# `git` installed, `.git/` un-excluded, `fetch-depth: 0` added below. That is
# the version this file now is — the failures are history, not a warning about
# what could still go wrong.
#
# `workflow_dispatch` only, on purpose, and not yet wired into `pull_request` or
# `push`. Running green once settles whether the packaging works; it does not
# by itself justify every PR paying for a Docker build. Widening the trigger is
# a separate, later decision.
#
# The image is built, never pushed. Nothing here reaches a registry: this settles
# whether the packaging works, not whether it should be distributed.

on:
  workflow_dispatch:

# Read by default. The image is built and inspected, never pushed anywhere,
# so nothing here needs to write.
permissions:
  contents: read

jobs:
  build:
    name: Build the engine image (deploy/local)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow (depth 1) is the default and is insufficient here: the
          # image bakes in engine/scripts/business_map.py, which counts days
          # since the repository's first commit, and a depth-1 checkout has
          # no commit before HEAD to count from. release.yml's gate job hit
          # the same thing first; same fix.
          fetch-depth: 0

      - name: Build, exactly the way the compose file documents it
        # `RUN python -m pytest tests/ -q` is baked into the Dockerfile itself —
        # a failing suite fails this build, so a green build already carries the
        # signal. Built through compose rather than a hand-typed `docker build`
        # so the paths this step exercises are the paths `DOCKER.md` and
        # `compose.yaml`'s own comment actually tell a person to run.
        run: docker compose -f deploy/local/compose.yaml build engine

      - name: The image exists under the tag compose actually gives it
        # A build succeeding is not the same as an image existing under a name
        # anything can find again — catches a build that silently produced
        # nothing tagged. The `engine` service has no explicit `image:`, so
        # compose synthesises one from `name: omnex-local`; read with
        # `docker compose build --print` (which resolves it without needing a
        # build to have run) rather than assumed, and confirmed to be
        # `omnex-local-engine`. Size is printed rather than asserted against a
        # number: the Dockerfile deliberately does not repeat one (a repo-root
        # context measures larger than an `engine/`-only one ever would, and
        # the honest comparison was never run), and the one figure actually
        # measured here (E-014: ~333 MB, run 34277853648) belongs in state, not
        # pinned into a workflow step that would then need editing every time
        # a dependency changes it.
        run: |
          docker inspect omnex-local-engine \
            --format 'built: {{.RepoTags}} size: {{.Size}} bytes'
