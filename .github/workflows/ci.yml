name: CI

# Runs the full check on every push: types, build, and the credit-ledger tests
# against a REAL Postgres started in a container.
#
# No Testcontainers Cloud: the ubuntu-latest runner already ships with a working
# Docker daemon, so containers here cost nothing. The Cloud product solves "my
# laptop is too weak" and bills per worker-minute after a one-time 50-minute
# trial — neither applies.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Read by default. Nothing in this workflow writes back to the repository,
# comments on anything, or reaches outside it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, build, database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Dependency review
        # Reviews only the DIFF a pull request introduces -- a new dependency
        # with a known vulnerability or an incompatible licence fails here,
        # before `npm audit` below would ever see it (audit checks everything
        # already installed, not what a PR is about to add). Only meaningful
        # on a pull_request event: there is no base ref to diff against on a
        # push. github.com/actions/dependency-review-action's own advisory
        # database, not this repository's -- it needs no credential.
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Install
        run: npm ci

      - name: Supply-chain audit
        # Dependabot found 13 open advisories on this repo the day it moved
        # organizations (a critical Next.js RCE among them) with no CI step that
        # would have caught any of it before merge. `npm audit` reached 0 by
        # bumping next/vitest directly and forcing three transitive packages
        # (qs, nanoid, brace-expansion) via `overrides` in package.json --
        # nested copies a direct-dependency bump does not always reach. This
        # step is what keeps that at 0 rather than a one-time cleanup: a
        # moderate-or-worse advisory fails the build here, before it fails
        # quietly in production.
        run: npm audit --audit-level=moderate

      - name: Types
        run: npx tsc --noEmit

      - name: Confirm Docker is available
        # The database suite skips itself when Docker is missing, which would
        # report green while asserting nothing. Fail here instead, loudly.
        # Moved ahead of the tests because they now run in one pass.
        run: docker info > /dev/null

      - name: Tests
        # EVERY test file, with no filter. The previous version named two files
        # by hand — one of which did not exist — so this step ran one suite of
        # seven and reported green. Unrun: the metering suite that asserts
        # liveModules() is exactly ['studio'], the budget suite that holds the
        # cache-before-fallback rule, and the stream suite that guards the usage
        # block the whole cost path depends on.
        #
        # A hand-written file list stops covering whatever somebody adds next,
        # silently. `engine/tests/test_ci_contract.py` now fails if this step
        # ever goes back to naming files, or names one that is not on disk.
        run: npx vitest run

      - name: Production build
        # Placeholder values: the build must not require live credentials, and if
        # it ever does, that is a bug worth catching here rather than at deploy.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npx next build
