name: CodeQL

# Sovereign Execution Standard, §6 SECURITY: static analysis for both
# languages this repository ships — the Next.js app (javascript-typescript)
# and the engine (python).
#
# CodeQL's "default setup" (enabled from the repository Settings UI, no file)
# is invisible to a repository scan: execution_state.json's gate 6 has said so
# explicitly since it was written — "CodeQL default setup and secret scanning
# are GitHub settings rather than files, so a repository scan cannot see them
# and this claims neither way." That sentence is honest about what a scan
# cannot see; it does not make the control exist. A workflow-based "advanced
# setup" is a committed file, so gate 6 can move from "cannot see it" to
# "here, or not" the same way every other Phase 2 control already did
# (Dependabot's config, the pinned actions, the SBOM). state_map.py's
# `codeql_workflow_present` fact reads this file's existence, nothing more —
# it cannot see whether results are ever triaged, the same honesty
# `sbom_generated` already keeps about the difference between a control
# running and a control mattering.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # A push-only trigger misses a vulnerability disclosed against code that
    # has not changed since — the same reason Dependabot runs on a schedule
    # rather than only on a manifest edit. Once a week, off the hour so it
    # does not compete with every other repository's cron at :00.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers the root Next.js app; python covers
        # engine/ and oss/citegate/. Neither needs a build step: both
        # languages' CodeQL extractors work from source.
        language: ["javascript-typescript", "python"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
