[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnex-engine"
version = "0.1.0"
description = "Production AI systems for OMNEX Factory — RAG, routing, agents, evals, guardrails, memory, serving."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Deliberately empty.
#
# The core of this engine — money, time, ids, retry, tracing, cost accounting,
# hybrid search, guardrails, the eval metrics — is written against the standard
# library. That is not minimalism for its own sake: it means `pytest` runs the
# whole suite on a bare interpreter, in CI, on a laptop with no network, and in
# a container that has never seen a GPU. Every heavy dependency below is an
# ADAPTER behind a Protocol, and every adapter has an in-repo counterpart that
# the tests use instead. A test suite that needs an API key is a test suite that
# stops being run.
dependencies = []

[project.optional-dependencies]
# Serving the HTTP surfaces (P7 local-first, P16 pipeline, P15 approval API).
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9", "httpx>=0.27"]

# P5 observability export. The in-memory collector needs none of this.
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "prometheus-client>=0.21",
]

# P2 router — the real multi-provider call path.
#
# tiktoken is here because `omnex.llm.tokens.TiktokenCounter` imports it and
# nothing declared it — no `pip install omnex-engine[...]` made that class work.
# Found by `release_check.py` asking imported→declared; `extras_check.py` asks
# declared→imported and cannot see this direction.
llm = ["litellm>=1.51", "tiktoken>=0.8"]

# P12 vector stores. sqlite-vec is the local default; qdrant is the scale path.
vectors = ["sqlite-vec>=0.1.6", "qdrant-client>=1.12", "numpy>=1.26"]

# P1 RAG document ingest and reranking.
rag = ["pypdf>=5.1", "sentence-transformers>=3.3"]

# P1 figure-level anchoring. `pdfplumber` reads vector objects and coordinates
# that `pypdf` does not expose, `pypdfium2` re-renders a region from the page
# rather than lifting the stored object, and tesseract needs a system binary —
# which is exactly why the whole of `rag/figures.py` above the adapter line runs
# on the standard library and the suite never installs any of this.
figures = ["pdfplumber>=0.11", "pypdfium2>=4.30", "pytesseract>=0.3.13", "imagehash>=4.3"]

# P13 memory — cross-session sync.
memory = ["redis>=5.2"]

# P16 distributed execution.
worker = ["celery>=5.4", "redis>=5.2"]

# P3 / P1 graph and crew adapters. The in-repo runtime is the default.
agents = ["langgraph>=0.2.45", "crewai>=0.86"]

# P4 external metric backends. The in-repo metrics are the default.
evals = ["deepeval>=2.0", "ragas>=0.2", "langsmith>=0.1.140"]

# P9 fine-tuning. Never installed in CI.
finetune = ["torch>=2.5", "transformers>=4.46", "peft>=0.13", "trl>=0.12", "datasets>=3.1"]

dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.omnex.extras]
# What each extra above actually delivers, checked by scripts/extras_check.py.
#
# `pip install omnex-engine[agents]` installs langgraph and crewai and gives you
# nothing: no module imports either. That is the same class of defect this
# repository has already paid for — n8n_bindings.json named
# `omnex.pipeline.verify_webhook`, a module that did not exist — and the same one
# `live_listings_are_covered` guards from the other side: a promise with nothing
# behind it.
#
# A declaration is evidence of an INTENDED interface, not proof the interface
# should exist. So the question per extra is "is the promise still intended?",
# and the answer is one of three states, never a silent absence:
#
#   supported     every declared dependency is imported by a module here
#   partial       some are; the unused ones must be named with a reason
#   unsupported   none are; `why` says what it would take, and the extra is a
#                 documented placeholder rather than a working install
#   tooling       not a capability (dev), exempt from the adapter rule
#
# Measured 2026-09-08 by grepping every import in src/omnex. Six of twelve
# extras had zero of their dependencies imported anywhere.

[tool.omnex.extras.api]
status = "unsupported"
why = "There is no HTTP surface in the engine. fastapi appears only as a STRING in intel/sources.py, which scans public sources for framework names — text, not an import. Serving P7/P15/P16 over HTTP would need routers that do not exist."

[tool.omnex.extras.otel]
status = "partial"
backed_by = ["omnex.obs.export"]
unused = ["prometheus-client"]
why = "obs/export.py imports opentelemetry. The Prometheus path is rendered as exposition text by obs/metrics.py without the client library, so the dependency buys nothing today."

[tool.omnex.extras.llm]
status = "supported"
backed_by = ["omnex.llm.litellm_adapter", "omnex.llm.tokens"]

[tool.omnex.extras.vectors]
status = "partial"
backed_by = ["omnex.vectors.qdrant_store"]
unused = ["sqlite-vec", "numpy"]
why = "qdrant_store.py imports qdrant-client. sqlite_store.py uses the standard library's sqlite3 rather than the sqlite-vec extension, and fusion/embed compute in pure Python — so both remaining pins are aspirational."

[tool.omnex.extras.rag]
status = "supported"
backed_by = ["omnex.rag.ingest", "omnex.rag.rerank"]

[tool.omnex.extras.figures]
status = "partial"
backed_by = ["omnex.rag.figures"]
unused = ["pypdfium2", "pytesseract", "imagehash"]
why = "figures.py imports pdfplumber for vector objects and coordinates. Region re-rendering, OCR and perceptual hashing are declared as Protocols with in-repo implementations, and no module imports those three libraries."

[tool.omnex.extras.memory]
status = "unsupported"
why = "No module imports redis. `memory` is ShortTermBuffer plus LongTermMemory in process; cross-session sync would need memory/redis_store.py, which does not exist."

[tool.omnex.extras.worker]
status = "unsupported"
why = "No module imports celery. pipeline/queue.py's docstring named `celery_adapter.py` as the production path and that file has never existed; the in-repo InMemoryBroker is the only broker. pipeline.Claims covers the durable case the n8n path actually needs."

[tool.omnex.extras.agents]
status = "unsupported"
why = "No module imports langgraph or crewai. graph/runtime.py's docstring named `langgraph_adapter.py` and that file has never existed. The in-repo Graph is not an adapter over either library, it is a separate runtime."

[tool.omnex.extras.evals]
status = "unsupported"
why = "No module imports deepeval, ragas or langsmith. omnex.evals computes its own metrics and gates on newly-failing cases; nothing routes to an external backend."

[tool.omnex.extras.finetune]
status = "unsupported"
why = "No module imports torch, transformers, peft, trl or datasets. omnex.finetune is deliberately the parts AROUND the training loop — decontamination, dedup, preference validation, forgetting checks — all pure Python. The four lines that need a GPU are not in this repository."

[tool.omnex.extras.dev]
status = "tooling"

[tool.hatch.build.targets.wheel]
packages = ["src/omnex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `scripts` is on the path because the generators in it — the eval gate, the
# benchmark builder, the leaderboard — are part of the deliverable and are
# tested, not loose utilities that happen to live in the repo.
pythonpath = ["src", "scripts"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "slow: needs a heavy optional dependency or a live service",
  "adapter: exercises a third-party adapter; skipped when the dep is absent",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",
  # The prose in this repo uses real typography — σ in a statistics docstring,
  # × in a ratio, · as a separator in CLI output. RUF001/RUF002 exist to catch
  # homoglyph attacks in identifiers, which is a different problem from a
  # deliberately-typeset comment.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/omnex"]
# Adapters import libraries that are not installed in CI. The Protocol on the
# in-repo side is what mypy actually checks; the adapter is checked when its
# extra is present.
ignore_missing_imports = true
